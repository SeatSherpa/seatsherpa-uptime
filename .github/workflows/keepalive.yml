name: Keep the schedule alive

# GitHub disables scheduled workflows in a public repository after 60 days
# without a commit. One tiny commit a month keeps the health probe running.

on:
  schedule:
    - cron: '23 10 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a timestamp
        run: |
          date -u +%Y-%m-%dT%H:%MZ > .last-keepalive
          git config user.name 'seatsherpa-uptime'
          git config user.email 'support@seatsherpa.app'
          git add .last-keepalive
          git commit -m "keepalive: $(cat .last-keepalive)" || exit 0
          git push
